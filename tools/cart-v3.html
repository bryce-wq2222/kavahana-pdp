    lines={kit:null,gifts:[],adds:lines&&lines.adds?lines.adds:[]};pending=true;render();open();
    var items=[{id:GIFT_IDS.cup,quantity:1,properties:{_u:'1'}},{id:GIFT_IDS.cup,quantity:1,properties:{_u:'2'}},{id:GIFT_IDS.whisk,quantity:1}];
    if(key==='4oz')items.push({id:GIFT_IDS.stix,quantity:1});
    items.push({id:K.id,quantity:1,selling_plan:'19079102782'});
    serial(function(){return getCart().then(function(c){var up={};(c.items||[]).forEach(function(i){var s=i.sku||'';if(s.indexOf('KH-GIFT-')===0||s.indexOf('KH-STARTER-KIT')===0)up[i.key]=0});
      if(Object.keys(up).length)return post('/cart/update.js',{updates:up}).catch(function(){});
    }).catch(function(){}).then(function(){return post('/cart/add.js',{items:items}).catch(function(){return post('/cart/add.js',{items:items})})})
      .then(function(){pending=false;building=false;return refreshNow()})
      .catch(function(e){pending=false;building=false;if(e&&e.busy){try{linesEl.innerHTML='<div class="kc-err">The cart is busy right now. <button type="button" class="kc-retry" data-kc-retry>Try again</button></div>'}catch(_){}return}try{linesEl.innerHTML='<div class="kc-err">Taking you straight to checkout&hellip;</div>'}catch(_){}fallbackSubmit(items)})});
  }
  root.addEventListener('click',function(e){
    var t=e.target;
    if(t.closest('[data-kc-close]')){close();return}
    if(t.closest('[data-kc-retry]')){build(key);return}
    var p=t.closest('[data-pill]');if(p){var a=p.getAttribute('data-pill').split(':');sel[a[0]]=+a[1];render();return}
    var ad=t.closest('[data-add]');if(ad&&!ad.disabled){var A=ADDONS.filter(function(x){return x.key===ad.getAttribute('data-add')})[0];var o=A.opts[sel[A.key]];ad.disabled=true;ad.textContent='ADDED';ad.classList.add('is-added');
      var snap=lines.adds.slice();lines.adds.push({key:'tmp'+Date.now(),vid:o[1],title:A.title+(A.opts.length>1?' ('+o[0]+')':''),sub:A.sub,price:o[2],qty:1,img:o[3]});render();
      var tmpKey=lines.adds[lines.adds.length-1].key;
      serial(function(){return post('/cart/add.js',{items:[{id:o[1],quantity:1}]}).then(function(res){var added=res&&res.items&&res.items[0];if(added&&added.key){lines.adds.forEach(function(x){if(x.key===tmpKey)x.key=added.key});render()}return refreshNow()}).catch(function(){lines.adds=snap;render()})});return}
    var rm=t.closest('[data-rm]');if(rm){var k=rm.getAttribute('data-rm');var gone=lines.adds.filter(function(x){return x.key===k})[0];var snap2=lines.adds.slice();lines.adds=lines.adds.filter(function(x){return x.key!==k});render();
      /* a Remove tapped before the add settled still carries the temporary key: resolve it by variant against the live cart */
      serial(function(){var p=k.indexOf('tmp')===0?getCart().then(function(c){var it=(c.items||[]).filter(function(i){return gone&&String(i.variant_id)===String(gone.vid)})[0];return it?post('/cart/change.js',{id:it.key,quantity:0}):null}):post('/cart/change.js',{id:k,quantity:0});return p.then(refreshNow).catch(function(){lines.adds=snap2;render()})});return}
    var up=t.closest('[data-upgrade]');if(up){var o4=document.querySelector('#kv-page .buy .opt[data-o="4oz"]');if(o4)o4.click();build('4oz');return}
    var st=t.closest('[data-kc-start]');if(st){build(window.__kvKey?window.__kvKey(null):'4oz');return}
    var go=t.closest('#kc-go');if(go&&!go.disabled){go.disabled=true;location.href=KITS[key].discount?'/discount/'+CODE+'?redirect=/checkout':'/checkout';return}
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&root.classList.contains('on'))close()});
  var KEY_BY_VID={'54144064749886':'4oz','54144064651582':'2oz'};
  function openExisting(){if(building){open();return}pending=false;lines={kit:null,gifts:[],adds:[]};render();open();getCart().then(function(cc){var L=fromShopify(cc);if(L.kit&&KEY_BY_VID[L.kit.vid])key=KEY_BY_VID[L.kit.vid];lines=L;render()}).catch(function(){})}
  document.addEventListener('click',function(e){var b=e.target&&e.target.closest&&e.target.closest('#CartButton, a[href="/cart"], a[href^="/cart?"]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();openExisting()},true);
  window.__kvOpenCart=build;window.__kvOpenExisting=openExisting;
  window.__kvCartState=function(){return {key:key,kit:!!(lines&&lines.kit),gifts:lines&&lines.gifts?lines.gifts.length:0,adds:lines&&lines.adds?lines.adds.length:0,open:root.classList.contains('on'),pending:pending}};
})();
